[project]
name = "tele-rpg-backend"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "aiogram>=3.17",
  "apscheduler>=3.10,<4",
  "pyjwt>=2.10",
  "pillow>=11.0",
  "pillow-heif>=0.21",
  "structlog>=24.4",
  "sentry-sdk>=2.19",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
  "jsonschema>=4.26.0",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]
